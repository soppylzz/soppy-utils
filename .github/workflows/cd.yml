name: Release & Tag

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'version bump'
        required: true
        type: choice
        default: auto
        options: [auto, major, minor, patch]

permissions:
  contents: write

concurrency: release

jobs:
  release:
    name: release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: resolve version
        id: version
        run: zsh scripts/version.sh resolve '${{ inputs.bump }}'

      - name: create and push tag
        if: steps.version.outputs.bump != 'none'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.next }}"
          git push origin "${{ steps.version.outputs.next }}"

      - name: publish release
        if: steps.version.outputs.bump != 'none'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.next }}
          generate_release_notes: true
