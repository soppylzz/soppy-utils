name: Release & Tag

on:
  workflow_dispatch:
    inputs:
      bump:
        description: version bump
        required: true
        type: choice
        default: auto
        options: [auto, major, minor, patch]

permissions:
  contents: read

concurrency: release

jobs:
  quality:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: go-task/setup-task@v2
        with:
          version: 3.53.1
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: go install mvdan.cc/sh/v3/cmd/shfmt@v3.12.0
      - name: check format and lint
        run: task lint

  smoke:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, target: darwin/arm64 }
          - { runner: ubuntu-24.04, target: linux/amd64 }
          - { runner: windows-2025, target: windows/amd64 }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: go-task/setup-task@v2
        with:
          version: 3.53.1
      - run: task test
      - name: native archive smoke test
        env:
          SPU_PACKAGE_TARGETS: ${{ matrix.target }}
        run: task smoke

  release:
    needs: [quality, smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: go-task/setup-task@v2
        with:
          version: 3.53.1
      - name: resolve version
        id: version
        run: task version:resolve BUMP='${{ inputs.bump }}'
      - name: build and validate assets
        if: steps.version.outputs.bump != 'none'
        run: |
          task package VERSION='${{ steps.version.outputs.next }}' OUT_DIR=dist
          test "$(find dist -name 'spu-*.tar.gz' | wc -l | tr -d ' ')" = 3
          test "$(wc -l < dist/SHA256SUMS | tr -d ' ')" = 3
      - name: create tag
        if: steps.version.outputs.bump != 'none'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git rev-parse '${{ steps.version.outputs.next }}' >/dev/null 2>&1; then
            test "$(git rev-parse '${{ steps.version.outputs.next }}^{commit}')" = "$(git rev-parse HEAD)"
          else
            git tag '${{ steps.version.outputs.next }}'
            git push origin '${{ steps.version.outputs.next }}'
          fi
      - name: publish release
        if: steps.version.outputs.bump != 'none'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.next }}
          generate_release_notes: true
          files: dist/*
