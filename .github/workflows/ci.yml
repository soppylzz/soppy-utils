name: Lint & Test

on:
  push:
    branches: [main]
    tags-ignore: ['**']
  pull_request:

jobs:
  lint:
    name: lint (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: install zsh (ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: install zsh-lint
        run: go install github.com/z-shell/zsh-lint/cmd/zsh-lint@latest
      - name: lint
        shell: zsh
        run: scripts/lint.sh

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: install zsh (ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: test
        shell: zsh
        run: scripts/test.sh

  suggest:
    name: suggest next version
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: install zsh (ubuntu)
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: suggest
        shell: zsh
        run: |
          scripts/version.sh suggest >> "$GITHUB_STEP_SUMMARY"
