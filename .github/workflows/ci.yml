name: Lint & Test

on:
  push:
    branches: [main]
    tags-ignore: ['**']
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: go-task/setup-task@v2
        with:
          version: 3.53.1
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: go install mvdan.cc/sh/v3/cmd/shfmt@v3.12.0
      - name: check format and lint
        run: task lint

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, target: darwin/arm64 }
          - { runner: ubuntu-24.04, target: linux/amd64 }
          - { runner: windows-2025, target: windows/amd64 }
    name: test (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: go-task/setup-task@v2
        with:
          version: 3.53.1
      - run: task test
      - name: native archive smoke test
        env:
          SPU_PACKAGE_TARGETS: ${{ matrix.target }}
        run: task smoke

  suggest:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: go-task/setup-task@v2
        with:
          version: 3.53.1
      - run: task version:suggest >> "$GITHUB_STEP_SUMMARY"
